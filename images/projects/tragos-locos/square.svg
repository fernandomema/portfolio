<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#12041f" flood-opacity="0.32"/>
    </filter>

    <clipPath id="screen1">
      <rect x="20" y="20" width="220" height="477" rx="28" ry="28"/>
    </clipPath>
    <clipPath id="screen2">
      <rect x="20" y="20" width="220" height="477" rx="28" ry="28"/>
    </clipPath>
    <clipPath id="screen3">
      <rect x="20" y="20" width="220" height="477" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="110" text-anchor="middle" fill="#ffffff"
        font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">
    Tragos Locos
  </text>

  <text x="540" y="160" text-anchor="middle" fill="#e9d5ff"
        font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">
    La aplicacion que te salvara de hacer otra fiesta aburrida
  </text>

  <!-- STEP 1 -->
  <g transform="translate(110 250)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="517" rx="44" fill="#18181b"/>
      <rect x="14" y="14" width="232" height="489" rx="36" fill="#3f3f46" opacity="0.35"/>
      <rect x="20" y="20" width="220" height="477" rx="28" fill="#000000"/>

      <image
        x="20" y="20"
        width="220" height="477"
        clip-path="url(#screen1)"
        preserveAspectRatio="xMidYMid slice"
        href="/images/projects/tragos-locos/step1.png"
      />

      <rect x="75" y="10" width="110" height="18" rx="9" fill="#18181b"/>
      <rect x="-8" y="90" width="8" height="36" rx="4" fill="#18181b"/>
      <rect x="-8" y="146" width="8" height="52" rx="4" fill="#18181b"/>
      <rect x="-8" y="214" width="8" height="52" rx="4" fill="#18181b"/>
      <rect x="260" y="150" width="8" height="70" rx="4" fill="#18181b"/>
    </g>

    <text x="130" y="572" text-anchor="middle" fill="#ffffff"
          font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">
      1. Crea una partida
    </text>

    <text x="130" y="607" text-anchor="middle" fill="#e9d5ff"
          font-family="Inter, Arial, sans-serif" font-size="18">
      Introduce los nombres de los jugadores.
    </text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(410 250)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="517" rx="44" fill="#18181b"/>
      <rect x="14" y="14" width="232" height="489" rx="36" fill="#3f3f46" opacity="0.35"/>
      <rect x="20" y="20" width="220" height="477" rx="28" fill="#000000"/>

      <image
        x="20" y="20"
        width="220" height="477"
        clip-path="url(#screen2)"
        preserveAspectRatio="xMidYMid slice"
        href="/images/projects/tragos-locos/step2.png"
      />

      <rect x="75" y="10" width="110" height="18" rx="9" fill="#18181b"/>
      <rect x="-8" y="90" width="8" height="36" rx="4" fill="#18181b"/>
      <rect x="-8" y="146" width="8" height="52" rx="4" fill="#18181b"/>
      <rect x="-8" y="214" width="8" height="52" rx="4" fill="#18181b"/>
      <rect x="260" y="150" width="8" height="70" rx="4" fill="#18181b"/>
    </g>

    <text x="130" y="572" text-anchor="middle" fill="#ffffff"
          font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">
      2. Selecciona un modo
    </text>

    <text x="130" y="607" text-anchor="middle" fill="#e9d5ff"
          font-family="Inter, Arial, sans-serif" font-size="18">
      Elige el modo de juego que más te apetezca.
    </text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(710 250)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="517" rx="44" fill="#18181b"/>
      <rect x="14" y="14" width="232" height="489" rx="36" fill="#3f3f46" opacity="0.35"/>
      <rect x="20" y="20" width="220" height="477" rx="28" fill="#000000"/>

      <image
        x="20" y="20"
        width="220" height="477"
        clip-path="url(#screen3)"
        preserveAspectRatio="xMidYMid slice"
        href="/images/projects/tragos-locos/step3.png"
      />

      <rect x="75" y="10" width="110" height="18" rx="9" fill="#18181b"/>
      <rect x="-8" y="90" width="8" height="36" rx="4" fill="#18181b"/>
      <rect x="-8" y="146" width="8" height="52" rx="4" fill="#18181b"/>
      <rect x="-8" y="214" width="8" height="52" rx="4" fill="#18181b"/>
      <rect x="260" y="150" width="8" height="70" rx="4" fill="#18181b"/>
    </g>

    <text x="130" y="572" text-anchor="middle" fill="#ffffff"
          font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">
      3. ¡Empieza a beber!
    </text>

    <text x="130" y="607" text-anchor="middle" fill="#e9d5ff"
          font-family="Inter, Arial, sans-serif" font-size="18">
      Responde tarjetas, cumple retos y sigue las reglas.
    </text>
  </g>
</svg>
